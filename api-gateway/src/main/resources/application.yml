server:
  port: 8090
  error:
    include-message: always

resilience:
  grpc:
    deadline-ms: ${GRPC_DEADLINE_MS:2500}

spring:
  cache:
    type: redis
  application:
    name: api-gateway
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      locations: classpath:graphql/
      printer:
        enabled: true
    exception-handling:
      include-message: always
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

logging:
  level:
    org.springframework.graphql: DEBUG
    org.springframework.web: INFO

services:
  auth:
    url: ${AUTH_SERVICE_URL:http://localhost:8085}

grpc:
  client:
    userService:
      address: ${GRPC_USER_ADDRESS:static://localhost:9091}
      negotiation-type: plaintext
    workoutService:
      address: ${GRPC_WORKOUT_ADDRESS:static://localhost:9192}
      negotiation-type: plaintext
    bookingService:
      address: ${GRPC_BOOKING_ADDRESS:static://localhost:9093}
      negotiation-type: plaintext
    analyticsService:
      address: ${GRPC_ANALYTICS_ADDRESS:static://localhost:9094}
      negotiation-type: plaintext
