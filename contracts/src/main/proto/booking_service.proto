syntax = "proto3";
package booking_service;
option java_package = "com.fitness.booking.grpc";
option java_multiple_files = true;

service BookingService {
  rpc GetBooking(GetBookingRequest) returns (BookingResponse);
  rpc GetBookings(ListBookingsRequest) returns (BookingListResponse);
  rpc GetClientBookings(GetClientBookingsRequest) returns (BookingListResponse);
  rpc GetSubscription(GetSubscriptionRequest) returns (SubscriptionResponse);
  rpc GetClientSubscriptions(GetClientSubscriptionsRequest) returns (SubscriptionListResponse);
  rpc GetActiveSubscription(GetActiveSubscriptionRequest) returns (SubscriptionResponse);
  rpc GetPayment(GetPaymentRequest) returns (PaymentResponse);
  rpc GetClientPayments(GetClientPaymentsRequest) returns (PaymentListResponse);
  rpc BookWorkout(BookWorkoutRequest) returns (BookingResponse);
  rpc CancelBooking(CancelBookingRequest) returns (BookingResponse);
}

enum BookingStatus {
  BOOKING_STATUS_UNKNOWN = 0;
  ACTIVE = 1;
  CANCELLED = 2;
}

enum PaymentStatus {
  PAYMENT_STATUS_UNKNOWN = 0;
  PENDING = 1;
  CONFIRMED = 2;
  FAILED = 3;
}

message GetBookingRequest { int64 id_booking = 1; }
message ListBookingsRequest { int64 id_client = 1; int64 id_workout = 2; }
message GetClientBookingsRequest {
  int64 id_client = 1;
  string status = 2;
  string sort_by = 3;
  string sort_order = 4;
}
message GetSubscriptionRequest { int64 id_subscription = 1; }
message GetClientSubscriptionsRequest { int64 id_client = 1; }
message GetActiveSubscriptionRequest { int64 id_client = 1; }
message GetPaymentRequest { int64 id_payment = 1; }
message GetClientPaymentsRequest {
  int64 id_client = 1;
  string date_from = 2;
  string date_to = 3;
}
message BookWorkoutRequest { int64 id_client = 1; int64 id_workout = 2; }
message CancelBookingRequest { int64 id_client = 1; int64 id_booking = 2; }

message BookingResponse {
  int64 id_booking = 1;
  int64 id_client = 2;
  int64 id_workout = 3;
  BookingStatus status = 4;
  string booking_date = 5;
}

message BookingListResponse { repeated BookingResponse bookings = 1; }

message SubscriptionResponse {
  int64 id_subscription = 1;
  int64 id_client = 2;
  string status = 3;
  int32 remaining_sessions = 4;
  string end_date = 5;
  int32 subscription_type_id = 6;
  string start_date = 7;
}

message PaymentResponse {
  int64 id_payment = 1;
  int64 id_client = 2;
  double amount = 3;
  PaymentStatus status = 4;
  string payment_date = 5;
}

message SubscriptionListResponse { repeated SubscriptionResponse subscriptions = 1; }
message PaymentListResponse { repeated PaymentResponse payments = 1; }
