syntax = "proto3";
package workout_service;
option java_package = "com.fitness.workout.grpc";
option java_multiple_files = true;

service WorkoutService {
  rpc GetWorkout(GetWorkoutRequest) returns (WorkoutResponse);
  rpc GetWorkouts(WorkoutsRequest) returns (WorkoutsResponse);
  rpc GetTrainingPrograms(ProgramsRequest) returns (ProgramsResponse);
  rpc GetProgressByClient(ProgressRequest) returns (ProgressListResponse);
  rpc CheckAvailability(CheckAvailabilityRequest) returns (CheckAvailabilityResponse);
  rpc ReserveSlot(ReserveSlotRequest) returns (ReserveSlotResponse);
  rpc ReleaseSlot(ReleaseSlotRequest) returns (ReleaseSlotResponse);
  rpc GetTrainingProgram(GetProgramRequest) returns (ProgramResponse);
}

enum WorkoutStatus {
  WORKOUT_STATUS_UNKNOWN = 0;
  PLANNED = 1;
  CANCELLED = 2;
  COMPLETED = 3;
}

message GetWorkoutRequest { int64 id_workout = 1; }
message WorkoutsRequest {
  int64 trainer_id = 1;
  int64 program_id = 2;
  string date_from = 3;
  string date_to = 4;
  string status = 5;
  string sort_by = 6;
  string sort_order = 7;
}
message WorkoutsResponse { repeated WorkoutResponse workouts = 1; }
message ProgramsRequest {
  string type = 1;
  string difficulty_level = 2;
  int64 trainer_id = 3;
  string sort_by = 4;
  string sort_order = 5;
}
message ProgramsResponse { repeated ProgramResponse programs = 1; }
message ProgressRequest {
  int64 client_id = 1;
  string date_from = 2;
  string date_to = 3;
}
message ProgressItem {
  int64 id_progress = 1;
  int64 id_client = 2;
  int64 id_booking = 3;
  string date = 4;
  double value = 5;
  string trainer_comment = 6;
}
message ProgressListResponse { repeated ProgressItem items = 1; }
message CheckAvailabilityRequest { int64 id_workout = 1; }
message ReserveSlotRequest { int64 id_workout = 1; }
message ReleaseSlotRequest { int64 id_workout = 1; }
message GetProgramRequest { int64 id_program = 1; }

message WorkoutResponse {
  int64 id_workout = 1;
  int64 id_training_program = 2;
  int64 id_trainer = 3;
  string start_datetime = 4;
  int32 duration = 5;
  WorkoutStatus status = 6;
  int32 max_capacity = 7;
  int32 booked_count = 8;
}

message CheckAvailabilityResponse { bool available = 1; int32 free_slots = 2; }
message ReserveSlotResponse { bool success = 1; int32 remaining = 2; }
message ReleaseSlotResponse { bool success = 1; int32 remaining = 2; }

message ProgramResponse {
  int64 id_training_program = 1;
  string name = 2;
  string type = 3;
  string difficulty_level = 4;
  int32 duration = 5;
  int64 id_trainer = 6;
  string description = 7;
}
